apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-app
  labels:
    app: ssl-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssl-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ssl-app
    spec:
      containers:
      - name: ssl-app
        image: 983004128212.dkr.ecr.us-east-1.amazonaws.com/ssl-app:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5